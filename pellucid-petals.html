<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pellucid petals — ENICOLL</title>
  <meta name="description" content="pellucid petals — an ongoing collection of hand-modeled digital glass flowers by emily nicoll, available on opensea.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="icon" href="images/favicon.ico">
  <style>
    .pp-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 1.4rem;
    }

    .pp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .pp-desc {
      font-family: var(--font-serif);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 55%;
    }

    .pp-btn {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      border: 2px solid var(--black);
      padding: 0.4em 0.8em;
      color: var(--black);
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.15s;
      box-shadow: 3px 3px 0 var(--black);
    }

    .pp-btn:hover { opacity: 0.65; }

    /* Justified gallery — rows of natural-ratio images filling full width */
    .pp-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .pp-gallery-row {
      display: flex;
      gap: 2rem;
      width: 100%;
    }

    .pp-gallery-row img,
    .pp-gallery-row video {
      display: block;
      flex: 1;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      min-width: 0;
      height: auto;
    }

    .pp-gallery-row img:hover { opacity: 0.85; }

    @media (max-width: 768px) {
      .pp-header { flex-direction: column; }
      .pp-desc { max-width: 100%; }
      .pp-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      .pp-gallery-row { display: contents; }
      .pp-gallery-row img,
      .pp-gallery-row video { width: 100%; height: auto; flex: none; }
    }
  </style>
</head>
<body>

  <!-- Mobile nav -->
  <div class="mobile-nav">
    <div class="hamburger" id="hamburger-btn">menu</div>
    <div class="mobile-menu" id="mobile-menu"></div>
  </div>

  <div class="site-wrapper">

    <nav class="left-nav"></nav>

    <main class="main-content">

      <div class="pp-title">pellucid petals</div>

      <div class="pp-header">
        <p class="pp-desc">collection of hand-modeled digital glass flowers. available as tokenized digital art editions via opensea.</p>
        <a class="pp-btn" href="https://opensea.io/collection/pellucid-petals" target="_blank">view collection</a>
      </div>

      <!-- Gallery: row 1 = 4, row 2 = 3, row 3 = 4 -->
      <div class="pp-gallery">
        <div class="pp-gallery-row">
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/bdabfbef11ca697a40d0489b20a316c9.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/f444c998d363a1681e8cdb9d3db06d2a.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/9747b4b8e7b58a7937260bcdafba945b.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/23b88dfc4d061814ea47f29618f10055.mp4" loop muted playsinline></video>
        </div>
        <div class="pp-gallery-row">
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/3ca43ed6b159071569e9596127212cfc.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/a78bed9046492d5886e8811ab48f011e.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/73fc555e750d750ca948f27e9bbf3a3b.mp4" loop muted playsinline></video>
        </div>
        <div class="pp-gallery-row">
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/cb9ce02e87a1c1a3af749df1620f44f5.mp4" loop muted playsinline></video>

          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/0cf9e324e881775173114aaf2c684765.mp4" loop muted playsinline></video>
          <video src="https://raw2.seadn.io/ethereum/0x495f947276749ce646f68ac8c248420045cb7b5e/04b04a85905c8a59cf4aeaba32a96a50.mp4" loop muted playsinline></video>
        </div>
      </div>

    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const videos = document.querySelectorAll('.pp-gallery-row video');

    if (isMobile) {
      videos.forEach(v => {
        v.setAttribute('preload', 'auto');
        // Force first frame on iOS
        v.play().then(() => v.pause()).catch(() => {});
        v.addEventListener('click', () => {
          v.paused ? v.play() : v.pause();
        });
      });
    } else {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.isIntersecting ? entry.target.play() : entry.target.pause();
        });
      }, { threshold: 0.9 });
      videos.forEach(v => observer.observe(v));
    }
  </script>
</body>
</html>

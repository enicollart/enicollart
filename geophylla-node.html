  return;
 }

  let best=null;
  for(let cols=1;cols<=VISIBLE;cols++){
   if(VISIBLE%cols)continue;

  for(let i=0;i<VISIBLE;i++)rects.push({x:left+(i%cols)*tile,y:top+Math.floor(i/cols)*tile,w:tile,h:tile});
  slots.forEach((slot,i)=>{const r=rects[i];if(!slot||!r)return;Object.assign(slot.node.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'})});

}
function appendImg(container,src,rotation,duration){
 const im=document.createElement('img');im.className='artLayer';im.src=src;im.draggable=false;
 container.append(im);
 if(rotation){
  const sign=rotation>0?1:-1;
  im.dataset.spinDirection=String(sign);
  im.dataset.spinPeriodSeconds=String(duration);
  const animation=im.animate(
   [{transform:'rotate(0deg)'},{transform:'rotate('+(sign*360)+'deg)'}],
   {duration:duration*1000,iterations:Infinity,easing:'linear'}
  );
  animation.playbackRate=1;
 }else{
  im.dataset.spinDirection='0';
 }
 return im;
}
function sourcePixels(renderSize){
 const forced=Number(qs.get('gridPixels'));
 const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
 const adaptive=Math.max(512,Math.ceil(renderSize*2.5*dpr));
 const requested=Number.isFinite(forced)&&forced>=256 ? forced : adaptive;
 return Math.max(256,Math.min(1280,GPU_MAX_SIDE,Math.ceil(requested)));
}
window.geophyllaLayerMotion=()=>{
 const samples=Array.from(grid.querySelectorAll('.artGroup'))
  .filter(g=>g.dataset.rotatingLayers && Number(g.dataset.rotatingLayers)>1)
  .slice(0,5);
 return {
  groupCount:grid.querySelectorAll('.artGroup').length,
  samples:samples.map(g=>{
   const rings=Array.from(g.querySelectorAll('.artLayer')).filter(im=>im.dataset.spinDirection!=='0');
   return {
    rotatingRings:rings.length,
    expectedRings:Number(g.dataset.rotatingLayers),
    distinctRingImages:new Set(rings.map(im=>im.src)).size,
    directions:rings.map(im=>im.dataset.spinDirection),
    periodsSeconds:rings.map(im=>Number(im.dataset.spinPeriodSeconds).toFixed(2)),
    activeAnimations:rings.map(im=>im.getAnimations().filter(a=>a.playState==='running').length)
   };
  })
 };
};
window.geophyllaGridQuality=()=>{
 const images=Array.from(grid.querySelectorAll('img.artLayer'));
 const groups=Array.from(grid.querySelectorAll('.artGroup'));
 const captures=groups.map(g=>Number(g.dataset.sourcePixels||0));
 const natural=images.filter(i=>i.complete&&i.naturalWidth>0).map(i=>i.naturalWidth);
 const tile=grid.querySelector('.tile');
 return {
  surface,mode,viewport:[innerWidth,innerHeight],devicePixelRatio:window.devicePixelRatio||1,
  tileCSSPixels:tile?Math.round(tile.getBoundingClientRect().width):null,
  expectedCapturePixels:tile?sourcePixels(tile.getBoundingClientRect().width):null,
  activeFlowers:groups.length,layerImages:images.length,
  actualCapturePixels:captures.length?[Math.min(...captures),Math.max(...captures)]:[],
  actualImagePixels:natural.length?[Math.min(...natural),Math.max(...natural)]:[],
  imageDecodesReady:natural.length,rotationSpeedsPreserved:true
 };
};
async function prepareGroup(id,renderSize,renderer=sharedRenderer,sourceCanvas=renderer.domElement){
 if(!validHash(hashes[id]))throw Error('Missing token hash for output '+id);
 const art=createGeophylla({hash:hashes[id],tokenId:String(FIRST+id)});
 const group=document.createElement('div');group.className='artGroup';
 try{
  const size=sourcePixels(renderSize);
  group.dataset.sourcePixels=String(size);
  if(sourceCanvas.width!==size||sourceCanvas.height!==size)renderer.setSize(size,size,false);
  if(renderer!==sharedRenderer){
   art.scene.environment=art.traits.Palette==='Hematite'?prepHematiteEnvironment:prepNormalEnvironment;
  }
  art.camera.aspect=1;art.camera.updateProjectionMatrix();
  const all=art.layerGroups;
  if(!all.every(layer=>art.root.children.includes(layer))){
   throw new Error('Petal layer hierarchy does not match independent capture expectations');
  }
  for(let i=0;i<all.length;i++){
   const image=captureLayer(art,[all[i]],renderer,sourceCanvas);
   const velocity=art.rotationSpeed*(1+.04*i)*all[i].userData.spinDir;
   const duration=Math.PI*2/(Math.abs(velocity)*60);
   appendImg(group,image,Math.sign(velocity),duration);
  }
  const rest=art.root.children.filter(child=>!all.includes(child));
  if(rest.length){const image=captureLayer(art,rest,renderer,sourceCanvas);appendImg(group,image,0,0)}
  group.dataset.rotatingLayers=String(all.length);
  return group;
 }finally{disposeArt(art)}
}
async function swap(i,id,cycle){
 if(mode!=='grid'||cycle!==runId)return;
 const slot=slots[i];if(!slot)return;
 try{
  const r=rects[i];
  const next=await prepareGroup(id,r.w);
  if(mode!=='grid'||cycle!==runId){destroyGroup(next);return}
  next.classList.add('in');slot.node.append(next);
  const old=slot.group;
  if(old)old.classList.add('out');
  requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.remove('in')));
  slot.id=id;slot.group=next;seen.add(id);gridUniqueSeen.add(id);
  if(old)setTimeout(()=>destroyGroup(old),transitionMS+100);
 }catch(err){showError('Could not load Geophylla #'+id+': '+err.message)}
}
function scheduleRefresh(cycle){
 if(gridRefreshRound>=GRID_ROUNDS)return;
 gridRefreshRound++;
 const pickIndices=shuffle(Array.from({length:VISIBLE},(_,i)=>i)).slice(0,CHANGES);
 const occupied=new Set(slots.filter(s=>s?.id!==null).map(s=>s.id));
 const choices=pickIndices.map(i=>{const id=pick(occupied);occupied.add(id);return {i,id}});
 prepQueue=prepQueue.catch(e=>showError('Grid queue: '+e.message)).then(async()=>{
  for(const {i,id} of choices){if(cycle!==runId||mode!=='grid')return;await swap(i,id,cycle);await wait(0)}
  if(gridUniqueSeen.size===COLLECTION && lastPassCount!==COLLECTION){
   gridCompletedPasses++;lastPassCount=COLLECTION;
   console.info('Geophylla: all 256 artworks displayed during grid mode.');
  }
 });
}

function startGridTimers(cycle){
 const refresh=()=>{
  if(mode!=='grid'||cycle!==runId)return;
  const phase=phaseAt(Date.now());
  if(phase<GRID_MS && phase>0 && gridRefreshRound<GRID_ROUNDS) scheduleRefresh(cycle);
  const remainder=phaseAt(Date.now())%CHANGE_MS;
  intervalHandle=setTimeout(refresh,Math.max(100,CHANGE_MS-remainder+25));
 };
 intervalHandle=setTimeout(refresh,Math.max(100,CHANGE_MS-(phaseAt(Date.now())%CHANGE_MS)+25));
 if(featuredAt(Date.now()))return safeSyncEntranceMode();
 gridEndTimer=setTimeout(safeSyncEntranceMode,Math.max(100,nextBoundaryDelay(Date.now())+40));
}

async function enterGrid(){
 if(gridBuildInProgress)return;
 gridBuildInProgress=true;
 try{
 const fadeFromFeature=mode==='feature'&&featured.length;
 if(fadeFromFeature)gridFadeInProgress=true;
 const cycle=++runId;
 clearTimeout(resizeTimer);resetTimers();clearTimeout(wallFadeTimer);wallFadeTimer=null;
 clearCubeDissolve();clearFeatureDissolve();cubeCurrentId=null;featureMinute=null;
 const oldFeatureRects=rects;
 mode='loading';computeLayout();
 const preparedGridRects=rects;
 if(fadeFromFeature){mode='feature';rects=oldFeatureRects}
 grid.style.display='block';grid.style.transition='none';
 if(fadeFromFeature){
  grid.style.opacity='0';canvas.style.display='block';canvas.style.transition='none';canvas.style.opacity='1';
 }else{
  cancelAnimationFrame(frameRequest);frameRequest=0;
  for(const art of featured)disposeArt(art);featured=[];
  clearGridTiles();
  mode='loading';canvas.style.display='none';canvas.style.opacity='1';grid.style.opacity='1';
 }
 const reuseGrid=fadeFromFeature && qs.get('reuseGrid')!=='0' &&
  slots.length===VISIBLE && slots.every(s=>s?.group && s.id!==null);
 const retainedIds=reuseGrid?slots.map(s=>s.id):[];
 seen=new Set(retainedIds);gridUniqueSeen=new Set(retainedIds);
 gridRefreshRound=0;lastPassCount=0;
 unseen=shuffle(Array.from({length:COLLECTION},(_,i)=>i).filter(i=>!seen.has(i)));
 if(reuseGrid){
  console.info('Geophylla: reusing 60 independent-layer grid works for smooth return.');
 }else{
  if(slots.length)clearGridTiles();
  slots=Array.from({length:VISIBLE},(_,i)=>allocateSlot(i,preparedGridRects[i]));
  const occupied=new Set();const startIds=[];
  for(let i=0;i<VISIBLE;i++){const id=pick(occupied);occupied.add(id);startIds.push(id)}
  const prep=fadeFromFeature?getPrepRenderer():sharedRenderer;
  const source=fadeFromFeature?prepCanvas:canvas;
  for(let i=0;i<VISIBLE;i++){
   if(cycle!==runId)return;
   try{
    const group=await prepareGroup(startIds[i],preparedGridRects[i].w,prep,source);
    if(cycle!==runId){destroyGroup(group);return}
    slots[i].node.append(group);slots[i].group=group;slots[i].id=startIds[i];seen.add(startIds[i]);gridUniqueSeen.add(startIds[i]);
   }catch(err){showError('Failed preparing output '+startIds[i]+': '+err.message)}
   if(i%5===0)showMessage('Preparing smooth animated grid: '+(i+1)+'/60');
   await wait(0);
  }
 }
 if(cycle!==runId)return;
 message.classList.remove('visible');
 if(fadeFromFeature){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   if(cycle!==runId)return;
   grid.style.transition=`opacity ${WALL_DISSOLVE_MS}ms ease-in-out`;
   canvas.style.transition=`opacity ${WALL_DISSOLVE_MS}ms ease-in-out`;
   grid.style.opacity='1';canvas.style.opacity='0';
   wallFadeTimer=setTimeout(()=>{
    if(cycle!==runId)return;
    cancelAnimationFrame(frameRequest);frameRequest=0;
    for(const art of featured)disposeArt(art);featured=[];
    canvas.style.display='none';canvas.style.transition='none';canvas.style.opacity='1';
    grid.style.transition='none';grid.style.opacity='1';
    rects=preparedGridRects;
    mode='grid';gridStart=performance.now();
    computeLayout();
    wallFadeTimer=null;gridFadeInProgress=false;
    startGridTimers(cycle);
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
     if(cycle===runId&&mode==='grid')sharpenGridAfterResize();
    },800);
   },WALL_DISSOLVE_MS+100);
  }));
 }else{
  mode='grid';gridStart=performance.now();
  startGridTimers(cycle);
 }
 }catch(e){
  gridFadeInProgress=false;
  showError('Automatic grid change failed: '+(e?.message||e));
 }finally{
  gridBuildInProgress=false;
 }
}
function drawFeatured(now){
 if(mode!=='feature'&&mode!=='cube')return;
 frameRequest=requestAnimationFrame(drawFeatured);
 const frameFactor=Math.min(3,(now-lastFeatureFrame||1000/60)/(1000/60));lastFeatureFrame=now;
 if(mode==='cube'&&cubeOutgoing){
  drawCubeBlend(now,frameFactor);
  return;
 }
 if(mode==='feature'&&featureOutgoing.length){
  drawFeatureBlend(now,frameFactor);
  return;
 }
 const W=canvas.width,H=canvas.height,scaleX=W/vw,scaleY=H/vh;
 sharedRenderer.setViewport(0,0,W,H);
 sharedRenderer.setScissorTest(false);sharedRenderer.setClearColor(0,0);
 sharedRenderer.clear(true,true,true);
 sharedRenderer.setScissorTest(true);
 for(let i=0;i<featured.length;i++){
  const art=featured[i],r=rects[i];
  if(!art||!r)continue;
  const x=Math.round(r.x*scaleX),y=Math.round((vh-r.y-r.h)*scaleY);
  const w=Math.round(r.w*scaleX),h=Math.round(r.h*scaleY);
  sharedRenderer.setViewport(x,y,w,h);sharedRenderer.setScissor(x,y,w,h);
  sharedRenderer.clear(true,true,true);
  sharedRenderer.toneMappingExposure=art.traits.Palette==='Hematite'?1.4:1;
  art.update(now,frameFactor);
  sharedRenderer.render(art.scene,art.camera);
 }
 sharedRenderer.setScissorTest(false);
 if(debugStatus){frameCounter++;if(now-lastStats>=1000){measuredFPS=frameCounter*1000/(now-lastStats);lastStats=now;frameCounter=0;showMessage('Featured mode: '+Math.round(measuredFPS)+' fps | Space: switch | 3 live WebGL outputs')}}
}

const ALLOWED_TRAITS={
 Palette:null,
 Body:new Set(['Trace','Wire']),
 Form:new Set(['Minimal']),
 Petals:new Set(['Blade','Plush']),
 Stamen:new Set(['Tendril'])
};
const ELIGIBLE_TRAITS=TRAIT_GROUPS.filter(g=>{
 if(!(g.key in ALLOWED_TRAITS))return false;
 const allowed=ALLOWED_TRAITS[g.key];
 return (!allowed || allowed.has(g.value)) && new Set(g.ids).size>=7;
});
const CUBE_MS=60000;
function enterCube(){
 clearTimeout(cubeTimer);
 const now=Date.now();
 let id;
 if(cohesiveFeatureAt(now)){
  const plan=cohesivePlanForTime(now);
  id=plan.cubeIds[cubeFace-1];
 }else{
  const minute=Math.floor(now/CUBE_MS);
  id=randomCubeIdsForMinute(minute)[cubeFace-1];
 }
 const scheduleNext=()=>{
  const t=Date.now();
  const toMinute=CUBE_MS-(t%CUBE_MS);
  const toBoundary=nextBoundaryDelay(t);
  cubeTimer=setTimeout(enterCube,Math.max(100,Math.min(toMinute,toBoundary)+40));
 };
 if(!validHash(hashes[id])){showError('Missing cube token hash: '+id);cubeTimer=setTimeout(enterCube,10000);return}
 if(mode==='cube'&&cubeCurrentId===id){scheduleNext();return}
 let nextArt;
 try{nextArt=createGeophylla({hash:hashes[id],tokenId:String(FIRST+id)})}
 catch(e){showError('Cube artwork: '+e.message);cubeTimer=setTimeout(enterCube,10000);return}
 if(mode==='cube'&&featured.length){
  clearCubeDissolve();
  cubeOutgoing=featured[0];
  featured=[nextArt];cubeCurrentId=id;
  cubeFadeStart=performance.now();
  lastFeatureFrame=cubeFadeStart;
 }else{
  reset();mode='cube';computeLayout();grid.style.display='none';canvas.style.display='block';
  const ratio=featurePixelRatio();
  sharedRenderer.setSize(Math.max(1,Math.round(vw*ratio)),Math.max(1,Math.round(vh*ratio)),false);
  canvas.style.width=vw+'px';canvas.style.height=vh+'px';
  featured=[nextArt];cubeCurrentId=id;
  lastFeatureFrame=performance.now();lastStats=lastFeatureFrame;
  frameRequest=requestAnimationFrame(drawFeatured);
 }
 scheduleNext();
}

function scheduleRandomFeatureRefresh(){
 clearTimeout(featureRefreshTimer);
 if(mode!=='feature'||cohesiveFeatureAt(Date.now()))return;
 const now=Date.now();
 if(!featuredAt(now))return;
 const timeToMinute=CUBE_MS-(now%CUBE_MS);
 const timeToEnd=nextBoundaryDelay(now);
 if(PREVIEW_MODE!=='random' && timeToEnd<=timeToMinute+100)return;
 featureRefreshTimer=setTimeout(()=>refreshRandomFeature(),Math.max(100,timeToMinute+40));
}
function refreshRandomFeature(){
 clearTimeout(featureRefreshTimer);featureRefreshTimer=null;
 const now=Date.now();
 if(mode!=='feature'||!featuredAt(now)||cohesiveFeatureAt(now))return;
 const minute=Math.floor(now/CUBE_MS);
 if(minute===featureMinute){scheduleRandomFeatureRefresh();return}
 const ids=randomFeaturedPlanForMinute(minute).featureIds;
 const next=[];
 try{
  for(const id of ids)next.push(createGeophylla({hash:hashes[id],tokenId:String(FIRST+id)}));
 }catch(e){
  next.forEach(disposeArt);showError('Featured minute refresh: '+e.message);
  scheduleRandomFeatureRefresh();return;
 }
 clearFeatureDissolve();
 featureOutgoing=featured;
 featured=next;
 featureMinute=minute;
 featureFadeStart=performance.now();
 lastFeatureFrame=featureFadeStart;
 scheduleRandomFeatureRefresh();
}

function enterFeature(){
 if(mode==='grid'){
  lastPassCount=gridUniqueSeen.size;
  if(lastPassCount<COLLECTION)console.warn('Only',lastPassCount,'of 256 artworks displayed in this grid pass.');
 }
 const fadeFromGrid=mode==='grid'&&slots.some(s=>s?.group);
 reset(fadeFromGrid);mode='feature';activeFeatureCycle=cycleIndexAt(Date.now());computeLayout();
 grid.style.display=fadeFromGrid?'block':'none';canvas.style.display='block';
 if(fadeFromGrid)canvas.style.opacity='0';
 const ratio=featurePixelRatio();
 sharedRenderer.setSize(Math.max(1,Math.round(vw*ratio)),Math.max(1,Math.round(vh*ratio)),false);
 const now=Date.now();
 let ids=[];
 if(cohesiveFeatureAt(now)){
  const plan=cohesivePlanForTime(now);
  ids=plan.featureIds;
  console.info('Geophylla shared trait:',plan.traitKey,plan.traitValue,
   'feature tokens:',ids.map(i=>FIRST+i),'cube tokens:',plan.cubeIds.map(i=>FIRST+i));
 }else{
  featureMinute=Math.floor(now/CUBE_MS);
  ids=randomFeaturedPlanForMinute(featureMinute).featureIds;
 }
 for(const id of ids){try{featured.push(createGeophylla({hash:hashes[id],tokenId:String(FIRST+id)}))}catch(e){showError('Featured artwork: '+e.message)}}
 lastFeatureFrame=performance.now();lastStats=lastFeatureFrame;
 frameRequest=requestAnimationFrame(drawFeatured);
 if(fadeFromGrid){
  const cycle=runId;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   if(runId!==cycle||mode!=='feature')return;
   grid.style.transition=`opacity ${WALL_DISSOLVE_MS}ms ease-in-out`;
   canvas.style.transition=`opacity ${WALL_DISSOLVE_MS}ms ease-in-out`;
   grid.style.opacity='0';canvas.style.opacity='1';
   wallFadeTimer=setTimeout(()=>{
    if(runId!==cycle||mode!=='feature')return;
    grid.style.display='block';grid.style.transition='none';grid.style.opacity='0';
    canvas.style.transition='none';canvas.style.opacity='1';wallFadeTimer=null;
   },WALL_DISSOLVE_MS+100);
  }));
 }
 featureEndTimer=setTimeout(safeSyncEntranceMode,Math.max(100,nextBoundaryDelay(Date.now())+40));
 if(!cohesiveFeatureAt(Date.now()))scheduleRandomFeatureRefresh();
}
function syncEntranceMode(){
 if(cubeFace||gridBuildInProgress||gridFadeInProgress)return;
 const now=Date.now();
 if(featuredAt(now)){
  if(mode!=='feature'||activeFeatureCycle!==cycleIndexAt(now))return enterFeature();
 }else if(mode!=='grid')return enterGrid();
}
function safeSyncEntranceMode(){
 try{
  const task=syncEntranceMode();
  if(task&&typeof task.catch==='function')task.catch(e=>showError('Automatic display change: '+(e?.message||e)));
 }catch(e){showError('Automatic display change: '+(e?.message||e))}
}
if(!cubeFace)setInterval(()=>{
 if(gridBuildInProgress||gridFadeInProgress)return;
 const now=Date.now();
 if(featuredAt(now)!==(mode==='feature') ||
    (featuredAt(now)&&mode==='feature'&&activeFeatureCycle!==cycleIndexAt(now))){
  safeSyncEntranceMode();
 }else if(mode==='feature'&&!cohesiveFeatureAt(now)&&featureMinute!==Math.floor(now/CUBE_MS)){
  refreshRandomFeature();
 }
},1500);

function sharpenGridAfterResize(){
 const cycle=runId;
 prepQueue=prepQueue.then(async()=>{
  for(let i=0;i<slots.length;i++){
   if(cycle!==runId||mode!=='grid')return;
   const slot=slots[i],old=slot?.group;
   if(!old||slot.id===null)continue;
   if(sourcePixels(rects[i].w)<=Number(old.dataset.sourcePixels||0)*1.08)continue;
   try{
    const next=await prepareGroup(slot.id,rects[i].w);
    if(cycle!==runId||mode!=='grid'||slot.group!==old){destroyGroup(next);continue}
    slot.node.append(next);destroyGroup(old);slot.group=next;
   }catch(e){showError('Resize: '+e.message)}
   await wait(0);
  }
 }).catch(e=>showError('Resize queue: '+e.message));
}
window.addEventListener('resize',()=>{
 if(mode==='grid'||mode==='loading'){
  computeLayout();
  clearTimeout(resizeTimer);
  if(mode==='grid')resizeTimer=setTimeout(sharpenGridAfterResize,500);
 }else if(mode==='feature'||mode==='cube'){
  computeLayout();const ratio=featurePixelRatio();
  sharedRenderer.setSize(Math.max(1,Math.round(vw*ratio)),Math.max(1,Math.round(vh*ratio)),false);
  canvas.style.width=vw+'px';canvas.style.height=vh+'px';
 }
});
if(cubeFace)setInterval(()=>{
 try{
  const now=Date.now();
  const expected=cohesiveFeatureAt(now)
   ? cohesivePlanForTime(now).cubeIds[cubeFace-1]
   : randomCubeIdsForMinute(Math.floor(now/CUBE_MS))[cubeFace-1];
  if(mode!=='cube'||cubeCurrentId!==expected)enterCube();
 }catch(e){showError('Cube clock recovery: '+(e?.message||e))}
},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){
 if(cubeFace)enterCube();
 else if(!gridBuildInProgress&&!gridFadeInProgress&&
    (featuredAt(Date.now())!==(mode==='feature') ||
    (mode==='feature'&&activeFeatureCycle!==cycleIndexAt(Date.now()))))safeSyncEntranceMode();
 else if(mode==='feature'&&!gridBuildInProgress&&!gridFadeInProgress&&!cohesiveFeatureAt(Date.now()))refreshRandomFeature();
}});
(async()=>{try{if(cubeFace)enterCube();else await syncEntranceMode();message.classList.remove('visible')}catch(e){showError(e.message);message.classList.remove('visible')}})();
})();

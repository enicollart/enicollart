<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENICOLL</title>
  <meta name="description" content="emily nicoll is a canadian artist, label owner and dj.">

  <!-- Open Graph -->
  <meta property="og:title" content="ENICOLL">
  <meta property="og:description" content="emily nicoll is a canadian artist, label owner and dj.">
  <meta property="og:url" content="https://enicoll.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #f5f2ec;
      --black:   #0e0e0e;
      --mid:     rgba(14,14,14,0.45);
      --light:   rgba(14,14,14,0.18);
      --accent: #E1E4D1;
      --accent3:  #e4ead4;
      --nav-w:   220px;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-mono:  'DM Mono', 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--black);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* homepage is full-viewport */
    }

    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.6; }

    /* ── p5 flower backdrop ── */
    #p5-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #p5-bg canvas {
      display: block;
    }

    /* ── Layout ── */
    .site-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 1;
    }

    /* ── Left nav ── */
    nav.left-nav {
      width: var(--nav-w);
      flex-shrink: 0;
      padding: 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      scrollbar-width: none;
      position: relative;
      z-index: 10;
      background: #ffffff;
    }
    nav.left-nav::-webkit-scrollbar { display: none; }

    .nav-name {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--accent);
      border: 1px solid rgba(14,14,14,0.25);
      display: inline-block;
      padding: 0.3em 0.55em;
      margin-bottom: 2.4rem;
      line-height: 1.3;
    }

    .nav-section {
      margin-bottom: 1.6rem;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.6rem;
      display: block;
    }

    nav.left-nav a {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--black);
      line-height: 1;
      padding: 0.32em 0;
      transition: opacity 0.15s;
    }
    nav.left-nav a:hover { opacity: 0.45; }
    nav.left-nav a.active { font-weight: 300; }
    nav.left-nav a.nav-name { letter-spacing: 0.1em; font-weight: 500; font-size: 1.2rem; padding-left: 0.4rem; font-family: var(--font-serif); }

    .nav-ext-link {
      display: flex;
      align-items: center;
      gap: 0.2em;
    }
    .nav-ext-link::after {
      content: ' ↗';
      font-size: 0.8rem;
      opacity: 1;
    }

    .nav-divider {
      height: 1px;
      background: var(--light);
      margin: 1.2rem 0;
    }

    /* ── Main content (homepage = empty, just backdrop) ── */
    .main-content {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 2rem;
    }

    .site-tagline {
      font-family: var(--font-serif);
      font-size: 0.8rem;
      font-weight: 300;
      font-style: italic;
      color: var(--mid);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 1s ease 0.8s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile nav ── */
    .mobile-nav {
      display: none;
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
    }

    .mobile-name {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 9999;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--accent);
      border: 1px solid rgba(14,14,14,0.25);
      padding: 0.3em 0.55em;
      line-height: 1.3;
      text-decoration: none;
      color: var(--black);
    }

    .hamburger {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(245, 242, 236, 0.88);
      border: 1px solid var(--light);
      padding: 0.45em 0.75em;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: rgba(245, 242, 236, 0.97);
      border: 1px solid var(--light);
      padding: 0.8rem 0;
      min-width: 130px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .mobile-menu.open { display: block; }

    .mobile-menu a {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      padding: 0.4em 1.1em;
      color: var(--black);
      transition: background 0.1s;
    }
    .mobile-menu a:hover { background: rgba(14,14,14,0.05); }

    .mobile-menu-label {
      font-family: var(--font-mono);
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      padding: 0.7em 1.1em 0.3em;
    }

    .mobile-menu-divider {
      height: 1px;
      background: var(--light);
      margin: 0.5rem 0;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .site-wrapper { position: relative; min-height: 100vh; flex-direction: column; }
      nav.left-nav { display: none; }
      .mobile-nav { display: block; }
      .mobile-name { display: block; }
      .main-content { min-height: 100vh; }
      #backdrop-canvas { position: fixed; }
    }
  </style>
</head>
<body>

  <!-- Flower backdrop -->
  <div id="p5-bg"></div>

  <!-- Mobile nav -->
  <a href="index.html" class="mobile-name">Emily Nicoll</a>
  <div class="mobile-nav">
    <div class="hamburger" id="hamburger-btn">menu</div>
    <div class="mobile-menu" id="mobile-menu"></div>
  </div>

  <!-- Main layout -->
  <div class="site-wrapper">

    <!-- Left nav (desktop) -->
    <nav class="left-nav"></nav>

    <!-- Content area -->
    <div class="main-content">
     
    </div>

  </div>

  <script>
    // ── Spinning flowers backdrop ──
    const SAGE = ['#dcedc8','#c8e6b0','#e8f5e2','#d4edbe','#c5e0aa'];
    const GREY = ['#aaaaaa','#cccccc','#888888','#bbbbbb','#999999'];
    const CENTER_FAMILIES = [SAGE, GREY];

    let flowers = [];
    let cols, rows, tileW, tileH;

    const sketch = (p) => {
      let flowers = [];
      let cols, tileW, tileH;
      let tmpl = null;

      p.setup = () => {
        let cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-bg');
        p.noSmooth();
        buildGrid();
      };

      p.windowResized = () => {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        buildGrid();
      };

      function buildGrid() {
        flowers = [];
        cols  = Math.floor(p.random(3, 13));
        tileW = p.width / cols;
        tileH = tileW;
        let rows = Math.ceil(p.height / tileH) + 1;

        // Single template shared by every cell
        let numLayers = Math.floor(p.random(2, 4));
        let layers = [];
        for (let l = 0; l < numLayers; l++) {
          let g = Math.floor(p.random(60, 210));
          let col = p.color(g, g, g);
          col.setAlpha(Math.floor(p.random(55, 145)));
          layers.push({
            petals : Math.floor(p.random(5, 14)),
            len    : tileW * p.map(l, 0, numLayers - 1, 0.44, 0.18),
            wid    : p.random(8, tileW * 0.22),
            shape  : p.random(['oval', 'oval', 'pointy']),
            col,
            dir    : p.random([-1, 1])
          });
        }
        let fam = p.random([SAGE, GREY]);
        let cc  = p.color(p.random(fam));
        cc.setAlpha(200);
        tmpl = {
          layers,
          centerCol  : cc,
          centerSize : tileW * p.random(0.04, 0.1),
          targetVel  : p.random(0.01, 0.025)
        };

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            flowers.push({ c, r, angle: p.random(p.TWO_PI), vel: 0 });
          }
        }
      }

      p.draw = () => {
        p.background(255);
        let hc = Math.floor(p.mouseX / tileW);
        let hr = Math.floor(p.mouseY / tileH);
        for (let f of flowers) {
          let hovered = f.c === hc && f.r === hr;
          f.vel = hovered
            ? p.lerp(f.vel, tmpl.targetVel, 0.12)
            : p.lerp(f.vel, 0, 0.04);
          f.angle += f.vel;
          drawFlower(f);
        }
      };

      function drawFlower(f) {
        p.push();
        p.translate((f.c + 0.5) * tileW, (f.r + 0.5) * tileH);
        for (let l = 0; l < tmpl.layers.length; l++) {
          let ly = tmpl.layers[l];
          p.push();
          p.rotate(f.angle * ly.dir + l * (p.TWO_PI / tmpl.layers.length) * 0.4);
          p.fill(ly.col);
          p.noStroke();
          for (let j = 0; j < ly.petals; j++) {
            p.push();
            p.rotate(p.TWO_PI / ly.petals * j);
            drawPetal(ly.wid, ly.len, ly.shape);
            p.pop();
          }
          p.pop();
        }
        p.fill(tmpl.centerCol);
        p.noStroke();
        p.ellipse(0, 0, tmpl.centerSize);
        p.pop();
      }

      function drawPetal(w, h, shape) {
        if (shape === 'oval') { p.ellipse(0, -h / 2, w, h); return; }
        p.beginShape();
        p.vertex(0, 0);
        p.bezierVertex(-w/2, -h*0.3, -w/2, -h*0.9, 0, -h);
        p.bezierVertex( w/2, -h*0.9,  w/2, -h*0.3, 0,  0);
        p.endShape(p.CLOSE);
      }
    };

    new p5(sketch);
  </script>
  <script src="shared.js"></script>
</body>
</html>

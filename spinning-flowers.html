  <style>

    }

    .sf-intro i { font-style: italic; }

    .sf-intro a {

      text-decoration: underline;
      color: inherit;
    }
    .sf-intro a:hover { opacity: 0.55; }

    .sf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

    }

    .sf-grid video {

    }

<body>

  <!-- Mobile nav -->
  <div class="mobile-nav">
    <div class="hamburger" id="hamburger-btn">menu</div>

  </div>

  <div class="site-wrapper">

    <nav class="left-nav"></nav>

    <main class="main-content">

  <script src="shared.js"></script>
  <script>
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const videos = document.querySelectorAll('.sf-grid video');

    if (isMobile) {
      videos.forEach(v => {
        v.setAttribute('preload', 'auto');
        // Force first frame on iOS
        v.play().then(() => v.pause()).catch(() => {});
        v.addEventListener('click', () => {
          v.paused ? v.play() : v.pause();
        });
      });
    } else {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.isIntersecting ? entry.target.play() : entry.target.pause();
        });
      }, { threshold: 0.9 });
      videos.forEach(v => observer.observe(v));
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trellis (generative algorithm) — ENICOLL</title>
  <meta name="description" content="generative spinning flower artwork by emily nicoll — p5.js.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="icon" href="images/favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    #sf-canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      cursor: pointer;
    }

    .site-wrapper {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    nav.left-nav {
      pointer-events: auto;
      background: #ffffff;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      height: 100vh;
      position: relative;
      z-index: 4;
    }

    nav.left-nav:hover,
    nav.left-nav.visible {
      transform: translateX(0);
    }



    main.main-content {
      display: none;
    }

    #sf-canvas-wrap canvas {
      display: block;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>
<body>

  <div class="mobile-nav">
    <div class="hamburger" id="hamburger-btn">menu</div>
    <div class="mobile-menu" id="mobile-menu"></div>
  </div>

  <div id="sf-canvas-wrap"></div>
  <div class="site-wrapper" >
    <nav class="left-nav" id="left-nav"></nav>

    <main class="main-content"></main>
  </div>

  <script src="shared.js"></script>
  <script>
    const leftNav = document.getElementById('left-nav');
    document.addEventListener('mousemove', e => {
      if (e.clientX < window.innerWidth * 0.25) {
        leftNav.classList.add('visible');
      } else {
        leftNav.classList.remove('visible');
      }
    });
  </script>
  <script>
    let layerData = [];
    let rotationMode;
    let baseRotationSpeed;
    let isAnimating = false;
    let noiseLayer;
    let inverseNoiseLayer;
    let bgColor;
    let popartGrid;
    let isRecording = false;
    let recordedFrames = 0;
    let totalRecordingFrames = 360;
    let myP5;

    const sketch = (p) => {
      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('sf-canvas-wrap');
        init();
        isAnimating = true;
        p.loop();
      };

      p.windowResized = () => {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        generateNoiseLayers();
        p.redraw();
      };

      function init() {
        layerData = [];
        generateNoiseLayers();

        let numLayers = Math.floor(p.random(3, 10));

        let r = p.random();
        if (r < 0.5) rotationMode = 'whole';
        else if (r < 0.8) rotationMode = 'alternate';
        else rotationMode = 'random';

        baseRotationSpeed = (p.TWO_PI / totalRecordingFrames);

        let palettes = [
          ['#ffffff'],
          ['#000000', '#333333', '#666666', '#999999', '#CCCCCC']
        ];
        let palette = p.random(palettes);

        if (palette.length === 1 && palette[0] === '#ffffff') {
          bgColor = p.random([0, 20, 40, 60]);
        } else {
          bgColor = p.random([220, 240, 255]);
        }

        for (let l = 0; l < numLayers; l++) {
          let petals = Math.floor(p.random(6, 20));
          let maxPetalLength = p.min(p.width, p.height) * 0.45;
          let minPetalLength = maxPetalLength * 0.3;
          let petalLength = p.map(l, 0, numLayers - 1, maxPetalLength, minPetalLength);
          let petalWidth = p.random(40, 120);
          let shapeType = p.random(['oval', 'pointy', 'spiky', 'exponential', 'looped', 'heart', 'trueHeart']);

          let layerColor = p.color(p.random(palette));
          if (palette.length === 1 && palette[0] === '#ffffff') {
            layerColor.setAlpha(50);
          } else {
            layerColor.setAlpha(120);
          }

          let rotationDir = 1;
          if (rotationMode === 'alternate') rotationDir = l % 2 === 0 ? 1 : -1;
          if (rotationMode === 'random') rotationDir = p.random([-1, 1]);

          let rotationSpeed = rotationMode === 'random' ? baseRotationSpeed * p.random(0.5, 2) : baseRotationSpeed;

          layerData.push({ petals, petalWidth, petalLength, shapeType, layerColor, rotationDir, rotationSpeed, angleOffset: p.random([0, 30, 45]) });
        }

        let centerSize = p.random(p.min(p.width, p.height) * 0.04, p.min(p.width, p.height) * 0.12);
        let useGreyscale = p.random() < 0.7;
        let centerColor;
        if (useGreyscale) {
          let g = p.random(50, 220);
          centerColor = p.color(g, g, g, 200);
        } else {
          let centerPalette = ['#B1E5F2','#DECAE2','#DAE5B3','#404224','#04223A','#002A18','#CF4D26','#0C64AC'];
          centerColor = p.color(p.random(centerPalette));
          centerColor.setAlpha(200);
        }
        layerData.center = {
          size: centerSize,
          color: centerColor,
          showEye: p.random() < 0.15,
          showStamen: p.random() < 0.8
        };

        let rPop = p.random();
        if (rPop < 0.30) popartGrid = 1;
        else if (rPop < 0.40) popartGrid = 2;
        else if (rPop < 0.80) popartGrid = 3;
        else if (rPop < 0.90) popartGrid = 5;
        else if (rPop < 0.97) popartGrid = 9;
        else popartGrid = 20;

        drawFlower();
      }

      p.draw = () => {
        if (!isAnimating && !isRecording) return;
        drawFlower();
        if (isRecording) {
          p.saveCanvas('frame_' + p.nf(recordedFrames, 4), 'png');
          recordedFrames++;
          if (recordedFrames >= totalRecordingFrames) {
            isRecording = false;
            isAnimating = false;
            p.noLoop();
            document.getElementById('btn-rotate').textContent = 'rotate: off';
          }
        }
      };

      p.keyPressed = () => {
        if (p.key === 'r' || p.key === 'R') {
          isAnimating = !isAnimating;
          if (isAnimating) p.loop();
          else { p.noLoop(); drawFlower(); }
          document.getElementById('btn-rotate').textContent = isAnimating ? 'rotate: on' : 'rotate: off';
        }
        if (p.key === 'g' || p.key === 'G') {
          isRecording = true;
          isAnimating = true;
          recordedFrames = 0;
          p.loop();
        }
      };

      function generateNoiseLayers() {
        noiseLayer = p.createGraphics(p.width, p.height);
        noiseLayer.blendMode(p.SCREEN);
        noiseLayer.clear();
        noiseLayer.loadPixels();
        for (let i = 0; i < noiseLayer.pixels.length; i += 4) {
          let n = p.randomGaussian(0, 50);
          noiseLayer.pixels[i] = n;
          noiseLayer.pixels[i+1] = n;
          noiseLayer.pixels[i+2] = n;
          noiseLayer.pixels[i+3] = 100;
        }
        noiseLayer.updatePixels();

        inverseNoiseLayer = p.createGraphics(p.width, p.height);
        inverseNoiseLayer.blendMode(p.DARKEST);
        inverseNoiseLayer.clear();
        inverseNoiseLayer.loadPixels();
        for (let i = 0; i < inverseNoiseLayer.pixels.length; i += 4) {
          let n = 255 - Math.abs(p.randomGaussian(0, 50));
          inverseNoiseLayer.pixels[i] = n;
          inverseNoiseLayer.pixels[i+1] = n;
          inverseNoiseLayer.pixels[i+2] = n;
          inverseNoiseLayer.pixels[i+3] = 100;
        }
        inverseNoiseLayer.updatePixels();
      }

      function drawFlower() {
        p.background(bgColor);
        let tileW = p.width / popartGrid;
        let tileH = p.height / popartGrid;

        for (let gx = 0; gx < popartGrid; gx++) {
          for (let gy = 0; gy < popartGrid; gy++) {
            p.push();
            p.translate((gx + 0.5) * tileW, (gy + 0.5) * tileH);
            p.scale(1 / popartGrid);

            if (rotationMode === 'whole') p.rotate(p.frameCount * baseRotationSpeed);

            for (let i = 0; i < layerData.length; i++) {
              let layer = layerData[i];
              p.push();
              if (rotationMode !== 'whole') p.rotate(p.frameCount * layer.rotationSpeed * layer.rotationDir);
              else p.rotate(p.radians(layer.angleOffset));
              p.fill(layer.layerColor);
              p.noStroke();
              for (let j = 0; j < layer.petals; j++) {
                p.push();
                p.rotate(p.TWO_PI / layer.petals * j);
                drawPetal(0, 0, layer.petalWidth, layer.petalLength, layer.shapeType);
                p.pop();
              }
              p.pop();
            }

            if (layerData.center.showStamen) {
              p.push();
              if (!layerData.center.stamenShared) {
                layerData.center.stamenShared = {
                  numSticks: Math.floor(p.random(8, 20)),
                  showPollen: p.random() < 0.7,
                  stamenLength: layerData.center.size * p.random(1.2, 2)
                };
              }
              let { numSticks, showPollen, stamenLength } = layerData.center.stamenShared;
              for (let i = 0; i < numSticks; i++) {
                let angle = p.TWO_PI / numSticks * i;
                let x1 = p.cos(angle) * (layerData.center.size / 2);
                let y1 = p.sin(angle) * (layerData.center.size / 2);
                let x2 = p.cos(angle) * stamenLength;
                let y2 = p.sin(angle) * stamenLength;
                p.strokeWeight(2);
                p.stroke(120, 180);
                p.line(x1, y1, x2, y2);
                if (showPollen) { p.noStroke(); p.fill(150); p.ellipse(x2, y2, 6); }
              }
              p.pop();
            }

            if (layerData.center.showEye) {
              p.noStroke(); p.fill(200);
              p.beginShape();
              let w = layerData.center.size * 1.5;
              let h = layerData.center.size;
              p.vertex(-w/2, 0);
              p.bezierVertex(-w*0.3, -h*0.5, w*0.3, -h*0.5, w/2, 0);
              p.bezierVertex(w*0.3, h*0.5, -w*0.3, h*0.5, -w/2, 0);
              p.endShape(p.CLOSE);
              p.fill(100); p.ellipse(0, 0, layerData.center.size * 0.6);
              p.fill(30);  p.ellipse(0, 0, layerData.center.size * 0.25);
            } else {
              p.fill(layerData.center.color); p.noStroke();
              p.ellipse(0, 0, layerData.center.size);
            }
            p.pop();
          }
        }

        p.resetMatrix();
        p.blendMode(p.SCREEN);   p.image(noiseLayer, 0, 0);
        p.blendMode(p.DARKEST);  p.image(inverseNoiseLayer, 0, 0);
        p.blendMode(p.BLEND);
      }

      function drawPetal(x, y, w, h, shapeType) {
        if (shapeType === 'oval') { p.ellipse(x, -h/2, w, h); return; }
        p.beginShape();
        if (shapeType === 'pointy') {
          p.vertex(x, y);
          p.bezierVertex(x-w/2, y-h*0.3, x-w/2, y-h*0.9, x, y-h);
          p.bezierVertex(x+w/2, y-h*0.9, x+w/2, y-h*0.3, x, y);
        } else if (shapeType === 'spiky') {
          p.vertex(x, y); p.vertex(x-w/2, y-h*0.3); p.vertex(x, y-h); p.vertex(x+w/2, y-h*0.3);
        } else if (shapeType === 'exponential') {
          p.vertex(x, y);
          p.bezierVertex(x-w*0.8, y-h*0.3, x-w*0.2, y-h*0.8, x, y-h);
          p.bezierVertex(x+w*0.2, y-h*0.8, x+w*0.8, y-h*0.3, x, y);
        } else if (shapeType === 'looped') {
          p.vertex(x, y);
          p.bezierVertex(x-w*0.5, y-h*0.2, x-w*0.2, y-h*0.9, x, y-h);
          p.bezierVertex(x+w*0.6, y-h*0.6, x+w*0.3, y-h*0.1, x, y);
        } else if (shapeType === 'heart') {
          p.vertex(x, y);
          p.bezierVertex(x-w/2, y-h*0.4, x-w*0.1, y-h*0.9, x, y-h);
          p.bezierVertex(x+w*0.1, y-h*0.9, x+w/2, y-h*0.4, x, y);
        } else if (shapeType === 'trueHeart') {
          p.vertex(x, y);
          p.bezierVertex(x-w/2, y-h*0.5, x-w/2, y-h*0.95, x, y-h*0.7);
          p.bezierVertex(x+w/2, y-h*0.95, x+w/2, y-h*0.5, x, y);
        }
        p.endShape(p.CLOSE);
      }

      // Expose init for buttons
      window._sfInit = init;
      window._sfSave = () => p.saveCanvas('spinning-flower', 'png');
      window._sfToggleRotate = () => {
        isAnimating = !isAnimating;
        if (isAnimating) p.loop();
        else { p.noLoop(); drawFlower(); }
        document.getElementById('btn-rotate').textContent = isAnimating ? 'rotate: on' : 'rotate: off';
      };
    };

    myP5 = new p5(sketch);

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>still image series — ENICOLL</title>
  <meta name="description" content="emily nicoll is a canadian artist, label owner and dj.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .si-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
    }

    .si-collage {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(20vw, 100%), 1fr));
      gap: 1rem;
    }

    .si-card {
      cursor: pointer;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .si-card-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }

    .si-card-thumb.active { opacity: 1; }
    .si-card:hover .si-card-thumb.active { opacity: 0.75; }

    .si-card-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5em 0.7em;
      background: linear-gradient(transparent, rgba(14,14,14,0.55));
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1;
    }

    .si-card:hover .si-card-label { opacity: 1; }

    .si-modal {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(14,14,14,0.88);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem 2rem;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .si-modal.open {
      opacity: 1;
      pointer-events: auto;
      
    }

    .si-modal-inner {
      background: var(--cream);
      max-width: 50vw;
      width: 100%;
      padding: 2rem;
      position: relative;
    }

    .si-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.6rem;
    }

    .si-modal-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .si-modal-year {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--mid);
      margin-left: 0.8rem;
    }

    .si-modal-close {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--mid);
      cursor: pointer;
      margin-left: 1.5rem;
      flex-shrink: 0;
    }

    .si-modal-close:hover { color: var(--black); }

    .si-modal-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      align-items: flex-start;
    }

    .si-modal-grid img {
      height: auto;
      display: block;
      cursor: zoom-in;
    }

    @media (max-width: 768px) {
      .si-collage { grid-template-columns: repeat(2, 1fr); }
      .si-modal { padding: 1rem; }
      .si-modal-inner { padding: 1.2rem; }
      .si-modal-grid img { width: 100% !important; }
    }

    /* ── Image lightbox ── */
    .si-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .si-lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .si-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .si-lb-close {
      position: absolute;
      top: 1.2rem;
      right: 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      letter-spacing: 0.1em;
      z-index: 1;
    }

    .si-lb-close:hover { color: #fff; }

    .si-lb-prev, .si-lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 1.4rem;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 1rem;
      user-select: none;
      z-index: 1;
    }

    .si-lb-prev:hover, .si-lb-next:hover { color: #fff; }
    .si-lb-prev { left: 1rem; }
    .si-lb-next { right: 1rem; }

    .si-lb-counter {
      position: absolute;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <div class="mobile-nav">
    <div class="hamburger" id="hamburger-btn">menu</div>
    <div class="mobile-menu" id="mobile-menu"></div>
  </div>

  <div class="site-wrapper">
    <nav class="left-nav"></nav>

    <main class="main-content">
      <div class="si-title">still image series</div>
      <div class="si-collage" id="si-collage"></div>
    </main>
  </div>

  <div class="si-modal" id="si-modal">
    <div class="si-modal-inner">
      <div class="si-modal-header">
        <div>
          <span class="si-modal-title" id="si-modal-title"></span>
          <span class="si-modal-year" id="si-modal-year"></span>
        </div>
        <span class="si-modal-close" id="si-modal-close">close ✕</span>
      </div>
      <div class="si-modal-grid" id="si-modal-grid"></div>
    </div>
  </div>


  <!-- Image lightbox -->
  <div class="si-lightbox" id="si-lightbox">
    <span class="si-lb-close" id="si-lb-close">close ✕</span>
    <span class="si-lb-prev" id="si-lb-prev">&#8592;</span>
    <img id="si-lb-img" src="" alt="">
    <span class="si-lb-next" id="si-lb-next">&#8594;</span>
    <span class="si-lb-counter" id="si-lb-counter"></span>
  </div>

  <script src="shared.js"></script>
  <script>
    // ── Add new series here ──
    // thumb: image shown in the collage grid (usually first image)
    // cols: columns in the popup grid
    // images: array of { src, alt }

    const SERIES = [
      {
        title: 'kaleidoscope',
        subtitle: 'diptych',
        year: '2023',
        thumb: 'images/still-image-series/kaleidoscope-1.png',
        cols: 2,
        images: [
          { src: 'images/still-image-series/kaleidoscope-1.png', alt: 'Kaleidoscope 1' },
          { src: 'images/still-image-series/kaleidoscope-2.png', alt: 'Kaleidoscope 2' },
        ]
      },
      {
        title: 'haze',
        year: '2023',
        thumb: 'images/still-image-series/haze-1.jpg',
        cols: 2,
        images: [
          { src: 'images/still-image-series/haze-1.jpg', alt: 'Haze 1' },
          { src: 'images/still-image-series/haze-2.jpg', alt: 'Haze 2' },
          { src: 'images/still-image-series/haze-3.jpg', alt: 'Haze 3' },
          { src: 'images/still-image-series/haze-4.jpg', alt: 'Haze 4' },
        ]
      },
      {
        title: 'gold study',
        year: '2023',
        thumb: 'images/still-image-series/gold-1.jpg',
        cols: 3,
        rowGroups: [
          { count: 3, align: 'flex-end' },
          { count: 3, align: 'flex-start' },
        ],
        images: [
          { src: 'images/still-image-series/gold-1.jpg', alt: 'Gold study 1' },
          { src: 'images/still-image-series/gold-2.jpg', alt: 'Gold study 2' },
          { src: 'images/still-image-series/gold-3.jpg', alt: 'Gold study 3' },
          { src: 'images/still-image-series/gold-4.jpg', alt: 'Gold study 4' },
          { src: 'images/still-image-series/gold-5.jpg', alt: 'Gold study 5' },
          { src: 'images/still-image-series/gold-6.jpg', alt: 'Gold study 6' },
        ]
      },
      {
  title: 'lettuce',
  year: '2025',
  cols: 4,
  images: [
    { src: 'images/still-image-series/lettuce1.png', alt: 'Lettuce 1' },
    { src: 'images/still-image-series/lettuce2.png', alt: 'Lettuce 2' },
    { src: 'images/still-image-series/lettuce3.png', alt: 'Lettuce 3' },
    { src: 'images/still-image-series/lettuce4.png', alt: 'Lettuce 4' },
    { src: 'images/still-image-series/lettuce5.png', alt: 'Lettuce 5' },
    { src: 'images/still-image-series/lettuce6.png', alt: 'Lettuce 6' },
    { src: 'images/still-image-series/lettuce7.png', alt: 'Lettuce 7' },
    { src: 'images/still-image-series/lettuce8.png', alt: 'Lettuce 8' },
  ]
},
{
  title: 'lime',
  year: '2025',
  cols: 3,
  images: [
    { src: 'images/still-image-series/lime1.png', alt: 'Lime 1' },
    { src: 'images/still-image-series/lime2.png', alt: 'Lime 2' },
    { src: 'images/still-image-series/lime3.png', alt: 'Lime 3' },
  ]
},
{
  title: 'station',
  year: '2025',
  cols: 3,
  images: [
    { src: 'images/still-image-series/station1.png', alt: 'Station 1' },
    { src: 'images/still-image-series/station2.png', alt: 'Station 2' },
    { src: 'images/still-image-series/station3.png', alt: 'Station 3' },
    { src: 'images/still-image-series/station4.png', alt: 'Station 4' },
    { src: 'images/still-image-series/station5.png', alt: 'Station 5' },
    { src: 'images/still-image-series/station6.png', alt: 'Station 6' },
  ]
},
{
  title: 'sungod',
  year: '2025',
  cols: 4,
  images: [
    { src: 'images/still-image-series/sungod1.png', alt: 'Sungod 1' },
    { src: 'images/still-image-series/sungod2.png', alt: 'Sungod 2' },
    { src: 'images/still-image-series/sungod3.png', alt: 'Sungod 3' },
    { src: 'images/still-image-series/sungod4.png', alt: 'Sungod 4' },
    { src: 'images/still-image-series/sungod5.png', alt: 'Sungod 5' },
    { src: 'images/still-image-series/sungod6.png', alt: 'Sungod 6' },
    { src: 'images/still-image-series/sungod7.png', alt: 'Sungod 7' },
    { src: 'images/still-image-series/sungod8.png', alt: 'Sungod 8' },
  ]
},
{
  title: 'halftime',
  year: '2025',
  cols: 3,
  images: [
    { src: 'images/still-image-series/halftime1.png', alt: 'Halftime 1' },
    { src: 'images/still-image-series/halftime2.png', alt: 'Halftime 2' },
    { src: 'images/still-image-series/halftime3.png', alt: 'Halftime 3' },
    { src: 'images/still-image-series/halftime4.png', alt: 'Halftime 4' },
    { src: 'images/still-image-series/halftime5.png', alt: 'Halftime 5' },
  ]
},
    ];

    const collage = document.getElementById('si-collage');

    SERIES.forEach((series, i) => {
      const card = document.createElement('div');
      card.className = 'si-card';

      // Render all images stacked, first one active
      const imgs = series.images.map((img, idx) =>
        `<img class="si-card-thumb${idx === 0 ? ' active' : ''}" src="${img.src}" alt="${img.alt}" loading="lazy">`
      ).join('');
      card.innerHTML = imgs + `<span class="si-card-label">${series.title}${series.subtitle ? ' — ' + series.subtitle : ''}</span>`;

      // Cycle through images every 1.5s
      let current = 0;
      const thumbs = card.querySelectorAll('.si-card-thumb');
      if (thumbs.length > 1) {
        setTimeout(() => {
          setInterval(() => {
            thumbs[current].classList.remove('active');
            current = (current + 1) % thumbs.length;
            thumbs[current].classList.add('active');
          }, 3000);
        }, i * 1000);
      }

      card.addEventListener('click', () => openModal(i));
      collage.appendChild(card);
    });

    const modal      = document.getElementById('si-modal');
    const modalTitle = document.getElementById('si-modal-title');
    const modalYear  = document.getElementById('si-modal-year');
    const modalGrid  = document.getElementById('si-modal-grid');
    const modalClose = document.getElementById('si-modal-close');

    let activeSeries = null;

    function openModal(index) {
      const s = SERIES[index];
      activeSeries = s;
      modalTitle.textContent = s.title + (s.subtitle ? ' — ' + s.subtitle : '');
      modalYear.textContent  = s.year || '';
      const imgWidth = `calc(${100 / s.cols}% - 0.8rem)`;
      if (s.rowGroups) {
        let imgIdx = 0;
        modalGrid.innerHTML = s.rowGroups.map(row => {
          const rowImgs = s.images.slice(imgIdx, imgIdx + row.count);
          imgIdx += row.count;
          return `<div style="display:flex;gap:0.8rem;width:100%;justify-content:center;align-items:${row.align};">` +
            rowImgs.map(img =>
              `<img src="${img.src}" alt="${img.alt}" loading="lazy" style="width:${imgWidth};height:auto;" data-index="${s.images.indexOf(img)}">`
            ).join('') +
          `</div>`;
        }).join('');
      } else {
        modalGrid.innerHTML = s.images.map((img, idx) =>
          `<img src="${img.src}" alt="${img.alt}" loading="lazy" style="width:${imgWidth};height:auto;align-self:flex-start;" data-index="${idx}">`
        ).join('');
      }
      // Bind lightbox on each image (works for both flat and rowGroup layouts)
      modalGrid.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', e => {
          e.stopPropagation();
          openLightbox(parseInt(img.dataset.index));
        });
      });
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    // ── Image lightbox ──
    const lightbox   = document.getElementById('si-lightbox');
    const lbImg      = document.getElementById('si-lb-img');
    const lbClose    = document.getElementById('si-lb-close');
    const lbPrev     = document.getElementById('si-lb-prev');
    const lbNext     = document.getElementById('si-lb-next');
    const lbCounter  = document.getElementById('si-lb-counter');
    let lbIndex = 0;

    function openLightbox(index) {
      lbIndex = index;
      showLbImage();
      lightbox.classList.add('open');
    }

    function showLbImage() {
      const imgs = activeSeries.images;
      lbImg.src = imgs[lbIndex].src;
      lbImg.alt = imgs[lbIndex].alt;
      lbCounter.textContent = `${lbIndex + 1} / ${imgs.length}`;
      lbPrev.style.visibility = imgs.length > 1 ? 'visible' : 'hidden';
      lbNext.style.visibility = imgs.length > 1 ? 'visible' : 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImg.src = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    lbPrev.addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex - 1 + activeSeries.images.length) % activeSeries.images.length;
      showLbImage();
    });

    lbNext.addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex + 1) % activeSeries.images.length;
      showLbImage();
    });

    document.addEventListener('keydown', e => {
      if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + activeSeries.images.length) % activeSeries.images.length; showLbImage(); }
        if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % activeSeries.images.length; showLbImage(); }
      } else if (modal.classList.contains('open')) {
        if (e.key === 'Escape') closeModal();
      }
    });
  </script>
</body>
</html>
